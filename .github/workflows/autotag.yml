# Semantic versioning from Conventional Commits (svu).
# After main CI succeeds, pushes a new v* tag when commits warrant a bump and
# explicitly dispatches release.yml on that tag.
name: autotag

# workflow_run keeps publishing behind the complete main CI gate. The manual
# trigger remains the recovery path for a missed/failed automatic run.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: autotag-main
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.26.5

jobs:
  autotag:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: false
      - name: Confirm the tested commit is current main
        id: freshness
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          current_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$TESTED_SHA" = "$current_main" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "tested commit is current main: $TESTED_SHA"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "skip stale successful run: tested=$TESTED_SHA current=$current_main"
          fi
      - name: Compute next tag with svu
        id: svu
        if: steps.freshness.outputs.current == 'true'
        run: |
          set -euo pipefail
          current=$(go run github.com/caarlos0/svu/v3@v3.2.3 current 2>/dev/null || echo "v0.0.0")
          next=$(go run github.com/caarlos0/svu/v3@v3.2.3 next)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "current=$current next=$next"
      - name: Push tag if new
        id: tag
        if: steps.svu.outputs.current != steps.svu.outputs.next
        env:
          RELEASE_TAG: ${{ steps.svu.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch release workflow
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.svu.outputs.next }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "$RELEASE_TAG"
          echo "dispatched release.yml for $RELEASE_TAG"
