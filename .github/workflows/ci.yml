# CI gates for public GitHub. No homelab secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GOTOOLCHAIN: go1.26.6

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Build
        run: go build ./...
      - name: Test (race + shuffle + coverage)
        run: |
          go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
      - name: Coverage gate (≥90% on business packages)
        # Statement-weighted coverage over the same denominator Sonar uses:
        # internal/** and pkg/** minus sonar.coverage.exclusions. The math and
        # the exclusion list live in scripts/coverage-gate.sh so the gate can be
        # reproduced locally with the same numbers.
        run: scripts/coverage-gate.sh coverage.out 90

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  secretscan:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --source . -v --no-banner

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -quiet ./...

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Download the trivy binary directly from the GitHub release
      # tarball. This avoids three problems with the Docker action:
      #   1. aquasecurity/trivy-action nests a container that the
      #      Gitea act_runner rejects (--network host + ExtraHosts
      #      is a conflicting Docker option pair).
      #   2. aquasecurity/setup-trivy@v0.3.1 clones the GitHub repo
      #      and the Gitea runner has no GitHub credentials.
      #   3. Running the binary directly works identically on both
      #      Gitea and GitHub Actions runners.
      # Pinned to a release version and the official per-architecture SHA-256.
      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.72.0"
          # Detect architecture. Gitea act_runner uses ARM64 on the
          # homelab (oracle-desktop); GitHub Actions uses x86_64.
          # Trivy release tarballs are per-arch: Linux-64bit (x86_64),
          # Linux-ARM64, Linux-ARM, etc. Download the matching one.
          case "$(uname -m)" in
            aarch64|arm64)  TRIVY_ARCH="Linux-ARM64"; TRIVY_SHA256="2ca2c023109c2db6b2b77366b6717291452d4531167377d95c79547f0c8e3467" ;;
            x86_64|amd64)   TRIVY_ARCH="Linux-64bit"; TRIVY_SHA256="bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea" ;;
            armv7l|armv7)   TRIVY_ARCH="Linux-ARM"; TRIVY_SHA256="b54b629ee03e6e894a0f652c8e07718a86610ca291f75453701d81a4cc277a8b" ;;
            *) echo "Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${TRIVY_ARCH}.tar.gz" \
            -o /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum --check --status
          tar xzf /tmp/trivy.tar.gz -C /tmp trivy
          mv /tmp/trivy /usr/local/bin/trivy
          chmod +x /usr/local/bin/trivy
          trivy --version
      - name: Trivy filesystem scan
        run: |
          trivy filesystem --exit-code 1 --severity CRITICAL,HIGH \
            --ignore-unfixed --quiet .

  agentics-keyword:
    name: agentics keyword harness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Build harness binaries
        run: |
          mkdir -p /tmp/semidx-bin
          go build -o /tmp/semidx-bin/semidx ./cmd/semidx
          go build -o /tmp/semidx-bin/mcp-probe ./deploy/agentics-test/mcp-probe
      - name: Run keyword variation
        run: PATH=/tmp/semidx-bin:$PATH ./deploy/agentics-test/run.sh keyword

  dispatch-release:
    name: dispatch release
    needs: [test, lint, secretscan, vulncheck, gosec, trivy, agentics-keyword]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch autotag for the tested commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh workflow run autotag.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field "tested_sha=$TESTED_SHA"
          echo "dispatched autotag.yml for $TESTED_SHA"
