# Release artifacts to GitHub Releases + GHCR. No Gitea / homelab tokens.
#
# Stable tags (vX.Y.Z): full release + GHCR :latest + :vX.Y.Z
# RC / prerelease tags (vX.Y.Z-rc.N, or any semver with '-'): GitHub prerelease
# (goreleaser prerelease:auto) + GHCR :vX.Y.Z-rc.N only — never overwrites :latest.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege: no workflow-level permissions; write scopes live on the jobs that need them.
# SonarCloud finding "Read permissions should be defined at the job level" is addressed by
# removing this workflow-level grant (jobs declare contents:read or write as required).

env:
  GOTOOLCHAIN: go1.26.6
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  goreleaser:
    name: goreleaser
    # NOTE: this workflow is GitHub-only. It uses actions
    # (docker/login-action, docker/build-push-action,
    # softprops/action-gh-release) and secrets (GITHUB_TOKEN, GHCR)
    # that don't exist on Gitea Actions. On Gitea the workflow will
    # fail at the first step — a job-level if-guard using env.X is
    # not supported by GitHub Actions (parse error). Gitea releases
    # are out of scope for automated CI; use the Gitea Releases API
    # to create them manually if needed.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # GitHub Actions runners have ~14 GB of ephemeral disk. Cross-compiling
      # 12 binaries (semidx + chatrag × 6 platform combos) fills the disk
      # and the Go linker aborts with "no space left on device". Free up
      # space before the heavy goreleaser build.
      # IMPORTANT: this MUST run before setup-go — it deletes the
      # pre-installed Go toolchains from /opt/hostedtoolcache/go/.
      # setup-go then installs the exact version we need into the
      # freshly-cleaned cache dir.
      - name: Free disk space before build
        run: |
          set -uo pipefail
          echo "=== disk before ==="
          df -h /tmp /github/workspace 2>/dev/null || true
          # Remove pre-installed language toolchains we don't need
          # (Node, Python, Ruby, Haskell, .NET, PHP, pre-installed Go).
          sudo rm -rf /opt/hostedtoolcache/Node* \
                       /opt/hostedtoolcache/Python* \
                       /opt/hostedtoolcache/Ruby* \
                       /opt/hostedtoolcache/Haskell* \
                       /opt/hostedtoolcache/PyPy* \
                       /opt/hostedtoolcache/dotnet \
                       /opt/hostedtoolcache/php \
                       /opt/hostedtoolcache/go/1.* 2>/dev/null || true
          # Clear /tmp.
          sudo rm -rf /tmp/* 2>/dev/null || true
          echo "=== disk after ==="
          df -h /tmp /github/workspace 2>/dev/null || true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: false
      - name: Classify tag (stable vs prerelease)
        id: meta
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "release.yml must run on a v* tag (got $REF)" >&2
            echo "For branch RC artifacts without a tag, use the rc.yml workflow." >&2
            exit 1
          fi
          # SemVer prerelease identifiers include a hyphen (v1.2.3-rc.1).
          if [[ "$REF_NAME" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "docker_tags=${REGISTRY}/${IMAGE_NAME}:${REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "classified $REF_NAME as prerelease (will not overwrite :latest)"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            {
              echo "docker_tags<<EOF"
              echo "${REGISTRY}/${IMAGE_NAME}:latest"
              echo "${REGISTRY}/${IMAGE_NAME}:${REF_NAME}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "classified $REF_NAME as stable"
          fi
      - name: Login to GHCR
        # Pin third-party actions by full commit SHA (SonarCloud S7637).
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build web admin assets
        run: |
          if [ -f scripts/build-web.sh ]; then
            bash scripts/build-web.sh
          fi
      - name: GoReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew/Scoop taps: skip upload when secret absent (see .goreleaser.yaml).
          # RC tags are still prereleases (prerelease: auto); do not configure
          # TAP_GITHUB_TOKEN on RC publishes if you want taps untouched.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CONFIG_FLAGS=""
          TAP_TOKEN="${TAP_GITHUB_TOKEN:-}"
          if [ -n "$TAP_TOKEN" ]; then
            # Verify the configured token can actually reach the tap repos.
            # A present-but-invalid/expired secret would otherwise make
            # GoReleaser attempt the upload and fail with 401.
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $TAP_TOKEN" \
              "https://api.github.com/repos/lgldsilva/homebrew-tap")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "TAP_GITHUB_TOKEN cannot access lgldsilva/homebrew-tap (HTTP $status); disabling tap publish" >&2
              TAP_TOKEN=""
            fi
          fi
          if [ -z "$TAP_TOKEN" ]; then
            # GoReleaser v2 ignores --skip for brews/scoops, and skip_upload
            # still evaluates as false when the secret is non-empty but invalid.
            # Generate a config with the brews/scoops sections removed.
            awk '/^brews:/ {exit} {print}' .goreleaser.yaml > /tmp/.goreleaser-notaps.yaml
            CONFIG_FLAGS="--config /tmp/.goreleaser-notaps.yaml"
          fi
          go run github.com/goreleaser/goreleaser/v2@v2.13.0 release --clean ${CONFIG_FLAGS}
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.docker_tags }}

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    needs: [goreleaser]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2.0.0
        with:
          version: v1.9.0
          # cyclonedx-gomod v1.9.0: `mod` generates a module-level SBOM
          # (all deps). `app` requires a single main-package path, not
          # a ./... pattern. Module path '.' = current directory.
          args: mod -licenses -json -output bom.json .
      - name: Upload SBOM to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: bom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  package-manifests:
    name: package manifests
    runs-on: ubuntu-latest
    needs: [goreleaser]
    # Stable releases only — AUR/Snap consumers should not track RCs.
    if: startsWith(github.ref, 'refs/tags/v') && needs.goreleaser.outputs.is_prerelease != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            --output checksums.txt \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/checksums.txt"
      - name: Render AUR and Snap manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/render-package-manifests.sh "$TAG" checksums.txt package-manifests
          tar -C package-manifests -czf "semidx-${TAG}-package-manifests.tar.gz" aur snap
          sha256sum "semidx-${TAG}-package-manifests.tar.gz" \
            >"semidx-${TAG}-package-manifests.tar.gz.sha256"
      - name: Upload package manifests to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            semidx-*-package-manifests.tar.gz
            semidx-*-package-manifests.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
